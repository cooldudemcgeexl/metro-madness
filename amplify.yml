version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install # Node version from .nvmrc
        - corepack enable # pnpm version from package.json "packageManager"
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .pnpm-store/**/*
